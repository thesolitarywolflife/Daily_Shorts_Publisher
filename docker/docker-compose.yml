services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - TZ=Asia/Kolkata
      - GENERIC_TIMEZONE=Asia/Kolkata
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - META_IG_USER_ID=${META_IG_USER_ID}
      - META_FB_PAGE_ID=${META_FB_PAGE_ID}
      # Allow Code node to read $env.GEMINI_API_KEY
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # Shorts are small — default (in-memory) avoids rupload corruption with parallel branches
      - N8N_DEFAULT_BINARY_DATA_MODE=${N8N_DEFAULT_BINARY_DATA_MODE:-default}
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
